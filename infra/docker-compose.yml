# Local development dependencies (ARCHITECTURE §2). Start with `pnpm infra:up`.
name: kavach

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kavach}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kavach}
      POSTGRES_DB: ${POSTGRES_DB:-kavach}
    ports:
      # Set POSTGRES_PORT in .env when 5432 is taken by a local PostgreSQL service.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    # BullMQ needs noeviction so jobs are never dropped under memory pressure.
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    ports:
      - '6379:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    profiles: ['s3']
    image: minio/minio:latest
    command: ['server', '/data', '--console-address', ':9001']
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-kavach}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-kavach-secret}
    ports:
      - '9000:9000' # S3 API
      - '9001:9001' # web console
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot: creates the private documents bucket, then exits.
  minio-init:
    profiles: ['s3']
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-kavach}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-kavach-secret}
      S3_BUCKET: ${S3_BUCKET:-kavach-documents}
    entrypoint: ['/bin/sh', '-c']
    command:
      - >
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" &&
        mc mb --ignore-existing "local/$$S3_BUCKET" &&
        mc anonymous set none "local/$$S3_BUCKET"

volumes:
  postgres-data:
  redis-data:
  minio-data:
