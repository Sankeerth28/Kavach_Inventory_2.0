# Render Blueprint, free plan: the API and the document worker share one free web service.
# Database and file storage are on Supabase (free). The web app is on Vercel (apps/web/vercel.json).
# Values marked `sync: false` are asked for in the Render dashboard when the Blueprint is created.
#
# Free-plan limits: the service sleeps after 15 minutes without traffic (the first request after
# that takes ~1 minute), and the worker only runs while the service is awake.

services:
  - type: web
    name: kavach-api
    runtime: node
    plan: free
    region: singapore # close to a Supabase project in Mumbai (ap-south-1) or Singapore
    buildCommand: >-
      npx --yes pnpm@12.21.0 install --frozen-lockfile --filter @kavach/api... --filter @kavach/worker... &&
      npx --yes pnpm@12.21.0 exec turbo run build --filter=@kavach/api --filter=@kavach/worker
    # Free plan has no pre-deploy step, so migrations run at start. The worker runs alongside the API.
    # NODE_ENV is set only at start so the build still installs dev dependencies (nest, tsc).
    startCommand: >-
      export NODE_ENV=production &&
      (cd packages/db && node ./node_modules/prisma/build/index.js migrate deploy) &&
      (cd apps/worker && node dist/main.js &) &&
      cd apps/api && exec node dist/main.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: '22.23.5'
      - key: DATABASE_URL
        sync: false # Supabase → Connect → Session pooler connection string
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: 'true'
      - key: COOKIE_PATH
        value: /kapi/auth # the web app proxies the API under /kapi (apps/web/next.config.ts)
      - key: TRUST_PROXY
        value: '2' # Vercel proxy + Render load balancer
      - key: WEB_ORIGIN
        sync: false # e.g. https://kavach-inventory.vercel.app
      - key: DOCUMENT_QUEUE
        value: db # PostgreSQL-backed queue: no Redis needed
      - key: DOCUMENT_CONCURRENCY
        value: '2' # the free service has 512 MB of memory
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        value: kavach-documents
      - key: S3_ENDPOINT
        sync: false # Supabase → Storage → Settings → S3 Connection → Endpoint
      - key: S3_REGION
        sync: false # your Supabase project region, e.g. ap-south-1
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: 'true'
