packages:
  - apps/*
  - packages/*

# Single source of truth for versions used by more than one workspace.
catalog:
  # typescript-eslint supports TypeScript <6.1, so we stay on 6.0.x for now.
  typescript: ~6.0.0
  eslint: ^10.0.0
  vitest: ^5.0.0
  zod: ^4.0.0
  '@types/node': ^22.19.0

# Dependencies allowed to run install scripts. Everything else is blocked by pnpm.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  '@swc/core': true
  esbuild: true
  '@parcel/watcher': false
  msgpackr-extract: false
  # sharp ships prebuilt binaries as optional dependencies; its install script only compiles from source.
  sharp: false

# Fail fast on the wrong Node version (see "engines" in package.json and .nvmrc).
engineStrict: true
